services:
  - type: web
    name: medicare-pro
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/dist/server.js
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: HOSPITAL_ID
        value: 65f0c0c2e5b1d229b984a101
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: COOKIE_SAME_SITE
        value: lax
